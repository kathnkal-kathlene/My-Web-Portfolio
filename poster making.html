<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ethereal Poster</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="poster.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

<!-- Floating Jellyfish -->
<div class="jellyfish" style="left: 20%; animation-delay: 0s;"></div>
<div class="jellyfish" style="left: 70%; animation-delay: 3s;"></div>
<div class="jellyfish" style="left: 50%; animation-delay: 6s;"></div>

<!-- Sparkles -->
<div class="sparkle" style="top: 10%; left: 30%;"></div>
<div class="sparkle" style="top: 40%; left: 80%;"></div>
<div class="sparkle" style="top: 70%; left: 20%;"></div>
<div class="sparkle" style="top: 60%; left: 60%;"></div>

<!-- Poster Content -->
<div class="poster">
    <div class="quote">
        I grew through the chaos I once thought would break me.
    </div>

    <div class="subtext">
        and somehow, in every sleepless night and quiet struggle,
        I found pieces of myself becoming stronger, braver, and more real.
    </div>

    <div class="name">
        ༊࿐ Kathlene Manayon ͎. ｡˚ ° ⊹ ˚.
    </div>
</div>

</body>
</html>
